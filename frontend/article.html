<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Article | ELAN Luxury Real Estate</title>
    <meta name="description" content="Explore stories on architecture, design, destinations, and timeless living from the ELAN Journal.">
    <meta name="theme-color" content="#ECEBEB">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon/android-chrome-192x192.png">
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="ELAN Journal">
    <meta property="og:description" content="Stories on architecture, design, destinations, and timeless living.">
    <meta property="og:site_name" content="ELAN">
    <meta property="og:locale" content="en_US">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/article.css">
    <link rel="stylesheet" href="./css/components.css">
    <!-- JS -->
    <script type="module" src="./js/article.js" defer></script>
    <script src="./js/components.js" defer></script>

</head>


<body>

    <div id="navbar"></div>


    <main>

        <!-- ARTICLE HERO -->

        <section class="article-hero-section">
            <div class="article-hero-bg">
                <picture>
                    <source id="article-hero-mobile" media="(max-width: 767px)" srcset="">
                    <source id="article-hero-tablet" media="(max-width: 991px)" srcset="">
                    <img id="article-hero-desktop" class="article-hero-image" src="" alt="" loading="eager">
                </picture>
            </div>
            <div class="container-lg">
                <div class="article-hero-content">
                    <span class="article-hero-label" id="article-label"></span>
                    <h1 class="hero-md article-hero-heading" id="article-title"></h1>
                    <div class="article-hero-meta">
                        <span id="article-date"></span>
                        <span id="article-reading-time"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ARTICLE CONTENT -->

        <section class="article-content-section">
            <div class="container-md">
                <div class="article-text-block">
                    <h2 class="second-heading-sm article-section-heading" id="section-one-heading"></h2>
                    <p class="article-intro" id="section-one-intro"></p>
                    <p class="article-paragraph" id="section-one-paragraph"></p>
                </div>
            </div>
            <img class="cinematic-journal" id="section-one-image" src="" alt="">
            <div class="container-md">
                <div class="article-text-block article-text-after-image">
                    <h2 class="second-heading-sm article-section-heading" id="section-two-heading"></h2>
                    <p class="article-paragraph" id="section-two-paragraph"></p>
                </div>
            </div>
            <img class="cinematic-journal" id="section-two-image" src="" alt="">

            <div class="container-md">
                <div class="article-text-block article-text-after-image">
                    <h2 class="second-heading-sm article-section-heading" id="section-three-heading"></h2>
                    <p class="article-paragraph" id="section-three-paragraph"></p>
                    <blockquote class="article-quote" id="article-quote"></blockquote>
                </div>
            </div>
        </section>

        <!-- YOU MAY ALSO LIKE -->

        <section class="related-articles-section">
            <div class="container-lg">
                <h2 class="related-articles-heading">You May Also Like</h2>
                <div class="related-articles-grid" id="related-articles-grid"></div>
            </div>
        </section>

    </main>


    <div id="footer"></div>


</body>

</html>
