<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residence | ELAN Luxury Real Estate</title>
    <meta name="description" content="Discover exceptional residences selected by ELAN Luxury Real Estate.">
    <meta name="theme-color" content="#121717">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon/android-chrome-192x192.png">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ELAN Luxury Real Estate">
    <meta property="og:description" content="Discover exceptional residences selected by ELAN Luxury Real Estate.">
    <meta property="og:site_name" content="ELAN">
    <meta property="og:locale" content="en_US">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/property.css">
    <link rel="stylesheet" href="./css/components.css">
    <!-- JS -->
    <script type="module" src="./js/property.js" defer></script>
    <script src="./js/components.js" defer></script>
</head>


<body>

    <div id="navbar"></div>


    <main>

        

        <section class="property-gallery-section">
          <div class="container-md">
              <div class="property-gallery">
                    <img class="property-gallery-main" id="property-main-image" src="" alt="">
                    <div class="property-gallery-middle">
                        <img class="property-gallery-small" id="property-top-right-image" src="" alt="">

                        <img class="property-gallery-small" id="property-bottom-left-image" src="" alt="">
                    </div>
                    <div class="property-gallery-right">
                        <img class="property-gallery-vertical" id="property-bottom-right-image" src="" alt="">
                        <button class="property-gallery-button" id="open-gallery" type="button">SHOW ALL PHOTOS</button>
                    </div>
                </div>
            </div>
        </section>



        <!-- PROPERTY OVERVIEW -->

        <section class="property-overview-section">
          <div class="container-md">
              <div class="property-overview-wrapper">
                  <div class="property-intro">
                        <h1 class="property-title" id="property-title"></h1>
                        <div class="property-location">
                            <img class="property-location-icon" src="./assets/icons/location-icon.svg" alt="">
                            <span id="property-location"></span>
                        </div>
                        <a class="property-viewing-button" href="./index.html#contact">SCHEDULE A VIEWING</a>
                    </div>
                    
                    <div class="property-overview-content">
                        <div class="property-stats">
                            <div class="property-stat">
                                <span class="property-stat-number" id="property-area"></span>
                            </div>
                            <div class="property-stat">
                                <span class="property-stat-number" id="property-floors"></span>
                            </div>
                            <div class="property-stat">
                                <span class="property-stat-number" id="property-bedrooms"></span>
                            </div>
                            <div class="property-stat">
                                <span class="property-stat-number" id="property-bathrooms"></span>
                            </div>
                        </div>

                        <div class="property-view-types" id="property-view-types"></div>

                       <div class="property-description">
                        <p id="description-one"></p>

                        <div class="property-description-extra" id="description-extra">
                            <p id="description-two"></p>
                            <p id="description-three"></p>
                        </div>

                        <button class="property-description-toggle" id="description-toggle" type="button" aria-expanded="false">
                            SHOW MORE <span>↓</span>
                        </button>
                    </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="property-features-section">
            <div class="container-md">
                <div class="property-features-wrapper">
                    <h2 class="property-section-heading">Features & Amenities</h2>
                    <div class="property-features-grid" id="property-features"></div>
                </div>
            </div>
        </section>

        <section class="property-details-section">
            <div class="container-md">
                <div class="property-details-wrapper">
                    <div class="floor-plan-wrapper">
                        <div class="floor-plan-image-wrapper">
                            <img class="floor-plan-image" id="floor-plan-image" src="" alt="Floor plan">
                        </div>
                        <a class="floor-plan-button" id="floor-plan-button" href="#" target="_blank" rel="noopener">VIEW FLOOR PLANS<span>→</span></a>
                    </div>

                    <div class="property-details-content">
                        <h2 class="property-section-heading">Property Details</h2>
                        <div class="property-details-list" id="property-details-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="similar-residences-section">
            <div class="container-md">
                <h2 class="property-section-heading">Similar Residences</h2>
                <div class="similar-residences-grid" id="similar-residences-grid"></div>
            </div>
        </section>
    </main>



    <div id="footer"></div>



    <!-- FULLSCREEN GALLERY -->

    <div class="gallery-modal" id="gallery-modal" aria-hidden="true">

        <button class="gallery-close" id="gallery-close" type="button" aria-label="Close gallery">
            <img src="./assets/icons/gallery-x.svg" alt=""></button>


        <button class="gallery-arrow gallery-arrow-left" id="gallery-prev" type="button" aria-label="Previous image">
            <img src="./assets/icons/gallery-arrow.svg" alt="">
        </button>


        <div class="gallery-modal-content" id="gallery-modal-content"></div>


        <button class="gallery-arrow gallery-arrow-right" id="gallery-next" type="button" aria-label="Next image">
            <img src="./assets/icons/gallery-arrow.svg" alt="">
        </button>

    </div>


</body>

</html>
